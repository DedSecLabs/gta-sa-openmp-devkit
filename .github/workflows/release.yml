name: release

# Publishes a GitHub Release when a semantic version tag (vX.Y.Z) is pushed.
# It never creates or moves tags: the maintainer pushes the tag after bumping the
# version in scripts/_common.py, SKILL.md and CHANGELOG.md. Re-running is safe.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    # Fast tag-specific gate. The tag ref is visible to the tests, which check that the
    # tag equals the tool version, SKILL.md metadata and the latest changelog entry.
    # Full OS/Python coverage is required separately: see "Require CI on this commit".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$TAG is not on main"; exit 1; }
      - name: Require CI on this commit
        # The full matrix runs on main pushes. Wait (up to 20 minutes) for it, then require success.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 80); do
            runs=$(gh run list --workflow ci.yml --branch main --commit "$GITHUB_SHA" \
                     --json status,conclusion --jq '[.[] | select(.status != "completed")] | length')
            ok=$(gh run list --workflow ci.yml --branch main --commit "$GITHUB_SHA" \
                     --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
            [ "$ok" -gt 0 ] && exit 0
            [ "$runs" -eq 0 ] && { echo "::error::no successful CI run on main for $GITHUB_SHA"; exit 1; }
            sleep 15
          done
          echo "::error::CI for $GITHUB_SHA did not finish in time; re-run this workflow"; exit 1
      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/release_notes.py "$TAG" > "$RUNNER_TEMP/notes.md"
      - name: Publish or refresh the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
