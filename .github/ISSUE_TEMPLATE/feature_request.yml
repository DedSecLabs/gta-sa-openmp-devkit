name: Feature request
description: Suggest an improvement to the skill, its tools or its documentation.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Suggestions are welcome; this form is not a commitment to build them. Please check the
        [Limitations](https://github.com/DedSecLabs/gta-sa-openmp-devkit#limitations) first, and search
        existing issues. **Do not attach game files or decompiled scripts.**
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the task your agent got wrong or could not do. A concrete example is best.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: A new check, tool, reference topic, or a change to the instructions.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you tried
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would be willing to open a pull request for this.
